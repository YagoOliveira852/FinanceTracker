# Lint e testes do backend. O job se chama "backend": é esse nome que entra
# como check obrigatório no ruleset da main.
# Sem filtro de paths de propósito: check obrigatório que não roda trava o PR.
name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Instala o Python fixado em .python-version e as dependências exatas do uv.lock.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      # O runner ubuntu já tem Docker: o testcontainers sobe o Postgres 16.
      - run: uv run pytest
