# Imagem Docker da API (backend/Dockerfile) para linux/amd64 e linux/arm64.
# Em PR só builda, para o Dockerfile quebrado aparecer antes do merge; em push
# na main, builda e publica no GHCR com as tags `latest` e `sha-<7 caracteres>`.
# O arm64 sai por emulação (QEMU): as dependências chegam como wheel prontas,
# então não há compilação lenta emulada.
# Sem filtro de paths: todo commit da main ganha uma imagem com a tag do seu sha.
name: imagem

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  # Na main, um publish em andamento termina antes do próximo começar.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATAFORMAS: linux/amd64,linux/arm64

jobs:
  imagem:
    name: imagem
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: ${{ env.PLATAFORMAS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publicar:
    name: publicar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só este job escreve no registry; o GITHUB_TOKEN do resto do repo é só leitura.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nome em minúsculas (o GHCR exige): ghcr.io/yagooliveira852/financetracker-api.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
