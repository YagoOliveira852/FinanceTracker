# Postgres de desenvolvimento. A senha vem do .env da raiz (ver .env.example).
# Para parar: `docker compose down` — nunca com -v, que apaga o volume com os dados.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz}
    ports:
      # Só na máquina local, nunca exposto na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
